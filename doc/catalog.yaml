# Metadata Catalog
# Covers all datasets in the data warehouse across all layers.
# Used by the LLM query interface to resolve dataset names, columns, and paths.

datasets:

  # ---------------------------------------------------------------------------
  # Bronze Layer — /panda/makalu-data/bronze/
  # Written by Kitakamakura from the raw msgpack; Makalu reads it via Komachi.
  # No analytics. No derived metrics.
  # Bronze contains only Trade and OrderBook.
  # ---------------------------------------------------------------------------

  - dataset_name: Trade
    layer: bronze
    description: Raw trade stream. One row per exchange trade.
    grain: per trade
    primary_timestamp: ts
    partition_columns: [exchange, symbol]
    source_dataset: null
    path_template: /panda/makalu-data/bronze/dataset=Trade/exchange={exchange}/symbol={symbol}/date={date}/data.parquet

  - dataset_name: OrderBook
    layer: bronze
    description: Full order book snapshots (20 levels each side). One row per snapshot.
    grain: per order book update
    primary_timestamp: ts
    partition_columns: [exchange, symbol]
    source_dataset: null
    path_template: /panda/makalu-data/bronze/dataset=OrderBook/exchange={exchange}/symbol={symbol}/date={date}/data.parquet

  # ---------------------------------------------------------------------------
  # Silver Layer — /panda/makalu-data/silver/
  # Point-in-time derived metrics and rolling trade-flow metrics.
  # ---------------------------------------------------------------------------

  - dataset_name: BookChange
    layer: silver
    description: >
      Per-update diff of the order book. Captures depth deltas, pull rates,
      and refill rates at multiple depth levels (k). Derived from consecutive
      OrderBook snapshots.
    grain: per order book update
    primary_timestamp: ts
    partition_columns: [exchange, symbol]
    source_dataset: OrderBook
    path_template: /panda/makalu-data/silver/dataset=BookChange/exchange={exchange}/symbol={symbol}/date={date}/data.parquet

  - dataset_name: BookState
    layer: silver
    description: >
      Snapshot-level microstructure state: best bid/ask, spread, volume
      imbalances, and microprice at multiple depth levels.
    grain: per order book update
    primary_timestamp: ts
    partition_columns: [exchange, symbol]
    source_dataset: OrderBook
    path_template: /panda/makalu-data/silver/dataset=BookState/exchange={exchange}/symbol={symbol}/date={date}/data.parquet

  - dataset_name: MarketPrice
    layer: silver
    description: >
      Effective execution prices after walking the order book by a fixed execution_size.
      Includes bid, ask, mid, spread, and spread_bps. Written by Hase (hase derive
      MarketPrice), which drops snapshots that cannot fill the size or whose walked
      spread exceeds 100 bps.
      IMPORTANT: execution_size is a required partition — always filter by it.
      Before querying, discover available values with:
        SELECT DISTINCT execution_size FROM marketprice WHERE exchange='X' AND symbol='Y' LIMIT 20
    grain: per order book update
    primary_timestamp: ts
    partition_columns: [exchange, symbol, execution_size]
    source_dataset: OrderBook
    path_template: /panda/makalu-data/silver/dataset=MarketPrice/exchange={exchange}/symbol={symbol}/execution_size={execution_size}/date={date}/data.parquet

  - dataset_name: TradeAggression
    layer: silver
    description: >
      Rolling window trade flow metrics attached to each trade event.
      Columns are suffixed with the window duration (e.g. buy_qty_5s).
      Windows are configurable per pipeline run.
    grain: per trade (with rolling window aggregations)
    primary_timestamp: ts
    partition_columns: [exchange, symbol]
    source_dataset: Trade
    path_template: /panda/makalu-data/silver/dataset=TradeAggression/exchange={exchange}/symbol={symbol}/date={date}/data.parquet

  # ---------------------------------------------------------------------------
  # Gold Layer — /panda/makalu-data/gold/
  # Window-based and statistical signals. Building blocks for features.
  # ---------------------------------------------------------------------------

  - dataset_name: Chart_CANDLE
    layer: gold
    description: >
      Time-based OHLCV candle bars. param_id encodes the bar period in seconds
      (e.g. "60s" = 1-minute candles).
    grain: per bar
    primary_timestamp: ts
    partition_columns: [exchange, symbol, param_id]
    source_dataset: Trade
    path_template: /panda/makalu-data/gold/dataset=Chart_CANDLE/exchange={exchange}/symbol={symbol}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: Chart_HEIKIN_ASHI
    layer: gold
    description: >
      Heikin-Ashi smoothed bars. OHLC values are derived from the average of
      current and previous bar values. param_id encodes the bar period in seconds.
    grain: per bar
    primary_timestamp: ts
    partition_columns: [exchange, symbol, param_id]
    source_dataset: Trade
    path_template: /panda/makalu-data/gold/dataset=Chart_HEIKIN_ASHI/exchange={exchange}/symbol={symbol}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: Chart_RANGE
    layer: gold
    description: >
      Range bars triggered by price movement (box_size_rate). Each bar closes
      when price moves by box_size_rate from the bar open. param_id encodes
      rate_<value> (e.g. rate_200 = 0.002 box size rate).
    grain: per bar (variable time)
    primary_timestamp: ts
    partition_columns: [exchange, symbol, param_id]
    source_dataset: Trade
    path_template: /panda/makalu-data/gold/dataset=Chart_RANGE/exchange={exchange}/symbol={symbol}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: LeadLag
    layer: gold
    description: >
      Cross-market lead-lag relationship metrics. Captures correlation structure,
      optimal lag, and lag stability between two markets (market_a leads market_b).
      Columns are suffixed with window and EWM span (e.g. ll_max_corr_60s_120s).
    grain: per sliding window step (stride configurable)
    primary_timestamp: ts
    partition_columns: [market_a, market_b, param_id]
    source_dataset: MarketPrice
    path_template: /panda/makalu-data/gold/dataset=LeadLag/market_a={market_a}/market_b={market_b}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: Spread
    layer: gold
    description: >
      EMA of the spread, in bps, on a 1 s grid of MarketPrice at execution_size
      (or the top of the book, execution_size=touch). Written by Hase
      (hase derive Spread --execution-size X --params SPAN); param_id is
      g<step>s_ema<span>s, e.g. g1s_ema300s. Column: spread_bps_ema.
      Divide Volatility's vol_bps_ema by spread_bps_ema for the tradability ratio.
    grain: 1 second
    primary_timestamp: ts
    partition_columns: [exchange, symbol, execution_size, param_id]
    source_dataset: MarketPrice
    path_template: /panda/makalu-data/gold/dataset=Spread/exchange={exchange}/symbol={symbol}/execution_size={execution_size}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: Volatility
    layer: gold
    description: >
      Volatility in bps on a 1 s grid of MarketPrice at execution_size (or the
      top of the book, execution_size=touch). Written by Hase (hase derive
      Volatility --execution-size X --params H:L:S); param_id is
      g<step>s_h<horizon>s_lb<lookback>s_ema<smooth>s, e.g. g1s_h60s_lb300s_ema120s.
      Columns: rv_bps (realized, over lookback), vol_bps (std of horizon returns
      over lookback), vol_bps_ema (smoothed over smooth).
    grain: 1 second
    primary_timestamp: ts
    partition_columns: [exchange, symbol, execution_size, param_id]
    source_dataset: MarketPrice
    path_template: /panda/makalu-data/gold/dataset=Volatility/exchange={exchange}/symbol={symbol}/execution_size={execution_size}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: ActivityCurve
    layer: gold
    description: >
      Weekly (day_of_week x time-of-day bin) volatility+spread activity curve,
      combining Volatility's vol_bps_ema and Spread's spread_bps_ema (z-score
      normalized per window, then averaged) into one mean+std curve per bin,
      min-max normalized to [0, 1]. Each populate run is a new date= snapshot
      equal to --end (the as-of date the training window describes), NOT the
      day the command happened to run -- backfilling many historical windows
      in one sitting produces one correctly-dated snapshot per window, not a
      collision on a single today's-date partition. Not a continuous time
      series -- read the most recent date= partition for "current". param_id
      encodes bin size, training window length in days, and execution_size,
      e.g. bin300s_z19d_es0.002.
    grain: one row per (day_of_week, bucket_index) -- 7 * (86400/bin_size_sec) rows per snapshot
    primary_timestamp: ts
    partition_columns: [exchange, symbol, param_id]
    source_dataset: Volatility
    path_template: /panda/makalu-data/gold/dataset=ActivityCurve/exchange={exchange}/symbol={symbol}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: LeadLagCurve
    layer: gold
    description: >
      Weekly (day_of_week x time-of-day bin) lead-lag-strength curve -- same
      shape and snapshot-per-populate-run convention as ActivityCurve, built
      from LeadLag's ll_max_corr* columns (absolute correlation strength,
      z-score normalized per window/span config, then averaged) instead of
      Volatility/Spread. param_id encodes bin size and training window length in days,
      e.g. bin300s_z19d.
    grain: one row per (day_of_week, bucket_index) -- 7 * (86400/bin_size_sec) rows per snapshot
    primary_timestamp: ts
    partition_columns: [market_a, market_b, param_id]
    source_dataset: LeadLag
    path_template: /panda/makalu-data/gold/dataset=LeadLagCurve/market_a={market_a}/market_b={market_b}/param_id={param_id}/date={date}/data.parquet

  # ---------------------------------------------------------------------------
  # Feature Layer — /panda/makalu-data/feature/
  # ML-ready feature tables. Tick-level, aligned to order book updates.
  # ---------------------------------------------------------------------------

  - dataset_name: Feature_Mid
    layer: feature
    description: >
      ML feature set targeting midprice direction. Combines trade aggression
      (ta_), book state (bs_), book change (bc_), execution price (ep_),
      trend (tr_), volatility (vo_), and cross-feature (cf_) signals.
    grain: per order book update (tick-level)
    primary_timestamp: ts
    partition_columns: [exchange, symbol]
    source_dataset: [BookState, BookChange, TradeAggression, MarketPrice, LeadLag]
    path_template: /panda/makalu-data/feature/dataset=Feature_Mid/exchange={exchange}/symbol={symbol}/date={date}/data.parquet

  - dataset_name: Feature_NearHFT
    layer: feature
    description: >
      ML feature set for near-HFT regime classification. Same column families
      as Feature_Mid but with tighter windows and additional short-horizon signals.
    grain: per order book update (tick-level)
    primary_timestamp: ts
    partition_columns: [exchange, symbol]
    source_dataset: [BookState, BookChange, TradeAggression, MarketPrice]
    path_template: /panda/makalu-data/feature/dataset=Feature_NearHFT/exchange={exchange}/symbol={symbol}/date={date}/data.parquet

  # ---------------------------------------------------------------------------
  # Research Layer — /panda/makalu-data/research/
  # Experiment outputs. Ephemeral and rebuildable. Not canonical.
  # ---------------------------------------------------------------------------

  - dataset_name: TripleBarrierLabel
    layer: research
    description: >
      Triple-barrier labels for supervised learning. Upper/lower barriers are
      dynamic multiples of volatility_ema. label = 1 (win), -1 (loss), 0 (timeout).
      param_id encodes barrier multiplier and timeout configuration.
    grain: per entry point (sampled from MarketPrice)
    primary_timestamp: ts
    partition_columns: [exchange, symbol, param_id]
    source_dataset: MarketPrice
    path_template: /panda/makalu-data/research/dataset=TripleBarrierLabel/exchange={exchange}/symbol={symbol}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: TripleBarrierLabel_tmp
    layer: research
    description: >
      Temporary triple-barrier label variant used during experimentation.
      Same schema as TripleBarrierLabel. Retained separately to preserve
      intermediate experiment outputs.
    grain: per entry point
    primary_timestamp: ts
    partition_columns: [exchange, symbol, param_id]
    source_dataset: MarketPrice
    path_template: /panda/makalu-data/research/dataset=TripleBarrierLabel_tmp/exchange={exchange}/symbol={symbol}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: BuyLabel_tmp
    layer: research
    description: >
      Binary buy-side labels. Barriers are spread-relative (multiples of
      spread_pct_ema). label = 1 (profit-take hit), 0 (stop-loss or timeout).
      Used for buy signal validation experiments.
    grain: per tick
    primary_timestamp: ts
    partition_columns: [exchange, symbol, param_id]
    source_dataset: MarketPrice
    path_template: /panda/makalu-data/research/dataset=BuyLabel_tmp/exchange={exchange}/symbol={symbol}/param_id={param_id}/date={date}/data.parquet

  - dataset_name: BacktestPnL
    layer: research
    description: >
      Per-fill backtest results from the Himalaya engine. One row per trade
      fill. param_set_id groups a full parameter sweep run.
    grain: per trade fill
    primary_timestamp: ts
    partition_columns: [strategy, exchange, symbol, variant, param_set_id]
    source_dataset: null
    path_template: /panda/makalu-data/research/dataset=BacktestPnL/strategy={strategy}/exchange={exchange}/symbol={symbol}/variant={variant}/param_set_id={param_set_id}/date={date}/data.parquet
