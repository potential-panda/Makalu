<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makalu — Data Warehouse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Topbar -->
    <header id="topbar">
      <div id="logo">
        <span id="logo-dot"></span>
        MAKALU
        <span id="logo-sub">Data Warehouse</span>
      </div>
    </header>

    <!-- Stats bar -->
    <div id="stats-bar">
      <div class="stat-item">
        <span class="stat-label">RAW</span>
        <span class="stat-value" id="stat-raw">—</span>
        <span class="stat-count" id="stat-raw-count"></span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span class="stat-dot bronze-dot"></span>
        <span class="stat-label">BRONZE</span>
        <span class="stat-value" id="stat-bronze">—</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span class="stat-dot silver-dot"></span>
        <span class="stat-label">SILVER</span>
        <span class="stat-value" id="stat-silver">—</span>
      </div>
      <div class="stat-sep"></div>
      <div class="stat-item">
        <span class="stat-dot gold-dot"></span>
        <span class="stat-label">GOLD</span>
        <span class="stat-value" id="stat-gold">—</span>
      </div>
    </div>

    <!-- Market bar -->
    <div id="market-bar">
      <select id="market-select">
        <option value="">Loading…</option>
      </select>
    </div>

    <!-- Main -->
    <div id="main">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="panel-label">LAYERS</div>
        <div class="legend">
          <div class="legend-row"><span class="leg-dot raw-dot"></span><span class="leg-name">Raw</span><span class="leg-count" id="leg-raw">—</span></div>
          <div class="legend-row"><span class="leg-dot bronze-dot"></span><span class="leg-name">Bronze</span><span class="leg-count" id="leg-bronze">—</span></div>
          <div class="legend-row"><span class="leg-dot silver-dot"></span><span class="leg-name">Silver</span><span class="leg-count" id="leg-silver">—</span></div>
          <div class="legend-row"><span class="leg-dot gold-dot"></span><span class="leg-name">Gold</span><span class="leg-count" id="leg-gold">—</span></div>
        </div>

        <div class="panel-label" style="margin-top:20px">SELECTED RANGE</div>
        <div id="range-display">
          <div class="range-row">
            <span class="range-label">From</span>
            <input type="date" id="range-start" class="date-input" />
          </div>
          <div class="range-row">
            <span class="range-label">To</span>
            <input type="date" id="range-end" class="date-input" />
          </div>
          <div id="range-days"></div>
        </div>

        <div class="panel-label" style="margin-top:20px">OPERATIONS</div>
        <div id="ops-panel">
          <button class="op-btn" id="btn-download">Download Raw</button>
          <div class="dataset-select-wrap">
            <select id="populate-dataset">
              <option value="bronze">bronze (Trade + OrderBook)</option>
              <option value="BookChange">silver: BookChange</option>
              <option value="BookState">silver: BookState</option>
              <option value="TradeAggression">silver: TradeAggression</option>
              <option value="MarketPrice">silver: MarketPrice</option>
            </select>
            <button class="op-btn op-btn-secondary" id="btn-populate">Populate</button>
          </div>

          <div class="ops-sep"></div>

          <div id="backtest-section">
            <select id="backtest-env" class="backtest-env-select">
              <option value="">Loading envs…</option>
            </select>
            <button class="op-btn op-btn-backtest" id="btn-backtest" disabled title="Bronze data required for full range">Backtest</button>
            <div id="backtest-status"></div>
          </div>
        </div>
      </aside>

      <!-- Calendar + Jobs -->
      <div id="content">
        <section id="dataset-section">
          <div class="section-header">
            <span class="panel-label">DATASETS</span>
            <button class="link-btn" id="dataset-refresh">refresh</button>
          </div>
          <div class="dataset-toolbar">
            <select id="dataset-select">
              <option value="">Loading…</option>
            </select>
            <div id="dataset-status" class="dataset-status">Loading dataset inventory…</div>
          </div>
          <div id="dataset-table-wrap">
            <div id="dataset-table"></div>
          </div>
          <div id="dataset-detail">
            <div class="detail-grid">
              <div class="detail-block">
                <div class="detail-label">Selection</div>
                <div id="dataset-summary" class="detail-value">Select a dataset.</div>
              </div>
              <div class="detail-block">
                <div class="detail-label">Partitions</div>
                <div id="dataset-partitions" class="detail-value">—</div>
              </div>
              <div class="detail-block">
                <div class="detail-label">Path</div>
                <div id="dataset-path" class="detail-value">—</div>
              </div>
            </div>
            <div id="dataset-controls" class="dataset-controls"></div>
            <div id="dataset-values" class="dataset-values"></div>
            <div id="dataset-ranges" class="dataset-ranges"></div>
          </div>
        </section>

        <section id="dataset-calendar-section">
          <div class="section-header">
            <span class="panel-label">DATASET CALENDAR</span>
            <div class="mode-toggle" role="tablist" aria-label="Dataset calendar mode">
              <button class="mode-btn is-active" id="dataset-mode-single" type="button">single</button>
              <button class="mode-btn" id="dataset-mode-compare" type="button">compare</button>
            </div>
          </div>
          <div class="dataset-toolbar">
            <div id="dataset-calendar-legend" class="dataset-legend"></div>
            <div id="dataset-calendar-status" class="dataset-status">Loading dataset calendar…</div>
          </div>
          <div id="dataset-calendar-header">
            <button class="nav-btn" id="dataset-cal-prev">&#x2190;</button>
            <span id="dataset-cal-month-label"></span>
            <button class="nav-btn" id="dataset-cal-next">&#x2192;</button>
          </div>
          <div id="dataset-calendar-spinner" style="display:none"></div>
          <div id="dataset-calendar-grid"></div>
        </section>

        <div id="calendar-container">
          <div id="calendar-header">
            <button class="nav-btn" id="cal-prev">&#x2190;</button>
            <span id="cal-month-label"></span>
            <button class="nav-btn" id="cal-next">&#x2192;</button>
          </div>
          <div id="calendar-spinner" style="display:none"></div>
          <div id="calendar-grid"></div>
        </div>

        <div id="jobs-section">
          <div class="section-header">
            <span class="panel-label">JOBS</span>
            <button class="link-btn" id="jobs-refresh">refresh</button>
          </div>
          <div id="jobs-list">
            <div class="jobs-empty">No jobs yet</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="viewport-indicator"></div>
  <script src="app.js"></script>
</body>
</html>
