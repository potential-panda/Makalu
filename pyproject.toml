[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makalu"
version = "0.1.0"
description = "Data pipeline for market microstructure feature engineering and ML model training"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "potential-panda"},
]

dependencies = [
    "kamakuraquantlab-qate>=0.4.0",
    "kamakuraquantlab-qate-env>=0.2.0",
    "kamakuraquantlab-komachi>=0.8.0",  # bronze file lookup and the datalake root
    "kamakuraquantlab-hase>=0.9.0",  # VolSpread and the spread/volatility formula
    "matplotlib==3.9.2",
    "k2-data @ git+ssh://git@github.com/potential-panda/k2-data.git@main",  # metrics-data S3 transfer
    "boto3>=1.40",
    "msgpack>=1.1",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "seaborn==0.13.2",
    "influxdb-client==1.49.0",
    "pyarrow>=22.0.0",  # for parquet file support
    "duckdb>=1.0.0",   # query engine for parquet data warehouse
    "pyyaml>=6.0",     # catalog loading
    "lightgbm>=4.0.0",  # for ML model training
    "scikit-learn==1.8.0", # Added for model evaluation and utilities
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
claude = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.0.0",
]

[project.scripts]
makalu-pipeline = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli"]

[tool.setuptools.package-data]
"makalu.report" = ["static/*", "static/vendor/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["makalu*", "pipeline*", "active_score*", "feature_engineering*", "labeling*", "lead_lag*", "simulation*", "training*"]

# [tool.black]
# line-length = 120
# target-version = ["py311"]

# [tool.ruff]
# line-length = 120
# target-version = "py311"

[tool.ruff.lint]
# Pinned rather than `extend-select`, which inherits ruff's default set. That
# default grew from five families to 414 rules in 0.16, so a version bump silently
# enabled UP, DTZ, TRY, SIM, B, PLR and RET here. Add a family deliberately.
select = ["E4", "E7", "E9", "F", "I"]
