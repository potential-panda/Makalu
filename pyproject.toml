[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makalu"
version = "0.1.0"
description = "Data pipeline for market microstructure feature engineering and ML model training"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "potential-panda"},
]

dependencies = [
    "potential-panda-core @ git+ssh://git@github.com/potential-panda/potential-panda-core.git@main",
    "matplotlib==3.9.2",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "seaborn==0.13.2",
    "influxdb-client==1.49.0",
    "pyarrow>=22.0.0",  # for parquet file support
    "duckdb>=1.0.0",   # query engine for parquet data warehouse
    "pyyaml>=6.0",     # catalog loading
    "lightgbm>=4.0.0",  # for ML model training
    "scikit-learn==1.8.0", # Added for model evaluation and utilities
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
claude = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.0.0",
]

[project.scripts]
makalu-pipeline = "pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipeline*"]

